environments:
  provision-vpc:
    name: "1. Provision Network (Terraform)"
    templateName: "demo-vpc"
    requiresApproval: false

  provision-eks:
    name: "2. Provision EKS Cluster (Terraform)"
    templateName: "acme-tf-eks"
    requiresApproval: false
    needs:
      - provision-vpc

  configure-cluster:
    name: "3. Configure Cluster (Ansible)"
    templateName: "acme-ansible-config"
    requiresApproval: false
    needs:
      - provision-eks

  deploy-app:
    name: "4. Deploy Application (Helm)"
    templateName: "acme-helm-app"
    requiresApproval: true
    needs:
      - configure-cluster
